<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <radialGradient id="glowBlue" cx="28%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#3a8eff" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#3a8eff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMoon" cx="80%" cy="78%" r="60%">
      <stop offset="0%" stop-color="#ffd38a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffd38a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfe0ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="#0d1117"/>
  <rect width="1200" height="320" fill="url(#glowBlue)"/>
  <rect width="1200" height="320" fill="url(#glowMoon)"/>

  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="107" x2="1200" y2="107"/>
    <line x1="0" y1="214" x2="1200" y2="214"/>
  </g>

  <!-- tiny spectrum bars, echoing the app's own visualizer -->
  <g opacity="0.5" fill="#7aa2f7">
    <rect x="120" y="248" width="6" height="14"/>
    <rect x="132" y="236" width="6" height="26"/>
    <rect x="144" y="220" width="6" height="42"/>
    <rect x="156" y="230" width="6" height="32"/>
    <rect x="168" y="244" width="6" height="18"/>
    <rect x="1026" y="244" width="6" height="18"/>
    <rect x="1038" y="230" width="6" height="32"/>
    <rect x="1050" y="220" width="6" height="42"/>
    <rect x="1062" y="236" width="6" height="26"/>
    <rect x="1074" y="248" width="6" height="14"/>
  </g>

  <text x="600" y="172" text-anchor="middle"
        font-family="ui-rounded,'SF Pro Rounded',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
        font-size="112" font-weight="700" letter-spacing="-1"
        fill="url(#textFade)">♪ Nocturne</text>

  <text x="600" y="224" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif"
        font-size="25" font-weight="500" letter-spacing="0.5"
        fill="rgba(228,234,246,0.55)">a music player that lives in the terminal</text>
</svg>
